name: Bug report
description: Report an incorrect audit, input error or report interaction.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please include a small reproducible example. Use synthetic data when sharing evaluation cases."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the exact command and a minimal pair of CSVs, or steps for a report interaction.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, Pairglass version, operating system and browser if relevant.
      placeholder: "Python 3.12, Pairglass 0.1.0, Ubuntu 24.04, Firefox"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Statistical evidence, if relevant
      description: Include paired support, wins, losses, expected p-value and the reference calculation.
  - type: textarea
    id: output
    attributes:
      label: Error or relevant output
      render: text
